[workspace]
members = ["crates/*"]
default-members = ["crates/e2etest"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
async-backtrace = "0.2.7"
axum = "0.8.9"
bcrypt = "0.19.3"
convert_case = "0.12.0"
e2etest = { path = "crates/e2etest", version = "0.4.0" }
e2etest-chroot = { path = "crates/e2etest-chroot", version = "0.1.0" }
e2etest-dns = { path = "crates/e2etest-dns", version = "0.2.0" }
e2etest-macros = { path = "crates/e2etest-macros", version = "0.3.0" }
e2etest-tls = { path = "crates/e2etest-tls", version = "0.1.0" }
futures = "0.3.34"
hickory-server = "0.26.3"
ipc-channel = "0.23.0"
itertools = "0.15.0"
linkme = "0.3.37"
neli = { version = "0.7.4", default-features = false, features = ["sync", "async"] }
nix = { version = "0.31.3", features = ["hostname", "mount", "net", "process", "sched", "user", "fs"] }
num-bigint = "0.5.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rustls = "0.23.46"
rustls-pki-types = "1.15.1"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
scylla = { version = "1.9.0", features = ["rustls-023"] }
scylla-proxy = "0.0.8"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full"] }
sysinfo = "0.39.6"
tap = "1.0.1"
tempfile = "3.27.0"
testcontainers = "0.28.0"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.29.0"
wildmatch = "2.6.1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
